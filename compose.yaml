

services:
  db:
    image: postgres:16
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stockflow
    ports:
      - "5433:5432"
    volumes:
      - stockflow_data:/var/lib/postgresql/data

volumes:
  stockflow_data:
